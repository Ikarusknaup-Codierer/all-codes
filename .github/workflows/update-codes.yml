name: Codes aktualisieren

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Codes einsammeln
        run: node scrape.mjs

      - name: Aenderungen committen
        run: |
          git config user.name "codes-bot"
          git config user.email "actions@github.com"
          git add public
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Codes aktualisiert: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
